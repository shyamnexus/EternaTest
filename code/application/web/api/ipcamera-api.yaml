openapi: 3.0.3
info:
  title: IP Camera API
  description: |
    Complete REST API for the IP Camera device.
    
    This API provides:
    - **Image**: ISP/Image settings (brightness, contrast, white balance, orientation, anti-flicker, exposure, day/night, BLC, enhancement)
    - **Video**: Video encoder settings (resolution, codec, bitrate, GOP, profiles, rate control)
    - **Audio**: Audio settings (codec, sample rate, AEC, ANR, AGC, gain)
    - **OSD**: On-Screen Display configuration (timestamp, text, logo, privacy masks)
    - **SMTP**: Email notification configuration and testing
    - **SNMP**: SNMP daemon configuration and control (SNMPv1/v2c/v3)
    - **UPnP**: UPnP IGD discovery and port mapping management
    - **SSL**: SSL/TLS certificate management (upload, generate, info)
    - **Analytics**: AI-powered video analytics (motion detection, tampering, smart detection, line crossing, zone intrusion, face detection/recognition, license plate recognition, heat map, pose estimation, audio classification)
    - **Events**: Event management, automation rules, statistics, and test triggers
    - **Notifications**: Notification server configuration (MQTT, Email, FTP) with test delivery
    - **Recording**: SD card recording management (start/stop, channels, storage)
    - **Playback**: Recorded video search, playback, and download
    - **RTSP**: RTSP server configuration and client management
    - **IR Control**: IR LED and IR-cut filter control for day/night operation
    - **Authentication**: Login, logout, password management, session management
    - **Security Questions**: Password recovery using security questions
    - **Forgot Password**: Self-service password reset using security questions
    - **Users**: User account management (create, read, update, delete)
    - **System**: Device info, time/NTP/DST, reboot, shutdown, factory reset, diagnostics, maintenance, watchdog, backup/restore, alarms
    - **Logging**: Multi-source log retrieval, security/audit/access logs, remote syslog, system logger control, diagnostic bundle
    - **Firmware**: Firmware version, upload, validate, upgrade, cancel
    
    All configuration changes are persisted to disk and some trigger automatic service reloads.
    
    ## Changelog
    
    ### Version 1.6.0 (2026-03-05)
    - **NEW**: Face Detection & Recognition API — detection model config, recognition gallery, face attribute analysis
    - **NEW**: License Plate Recognition (LPR) API — ANPR/ALPR with region support and event actions
    - **NEW**: Heat Map API — spatial activity density grid with configurable decay
    - **NEW**: Pose Estimation API — human body keypoint detection with YOLO model
    - **NEW**: Audio Classification API — YAMNet-based environmental sound event detection
    - **UPDATED**: Analytics overview table reflects all available AI modules
    
    ### Version 1.5.0 (2026-02-25)
    - **SECURITY**: AES-256-GCM replaces AES-256-CBC for password transit encryption
    - **SECURITY**: PBKDF2-HMAC-SHA256 with 210K iterations for password hashing
    - **SECURITY**: Per-device random salt for SQLCipher key derivation
    - **SECURITY**: WSSE storage upgraded from XOR to AES-256-GCM
    - **SECURITY**: Hardcoded default password fallback removed
    - **SECURITY**: Shell command injection protection added
    - **SECURITY**: Constant-time comparison for password verification
    - **SECURITY**: std::rand() replaced with RAND_bytes() for all RNG
    - **UPDATED**: Auth API v1.4.0 — EncryptedPassword schema adds `auth_tag` field for GCM
    - **UPDATED**: Auth API — PublicKeyResponse `aes_algorithm` now returns `AES-256-GCM`
    - **UPDATED**: Users API — EncryptedPassword schema adds `auth_tag` field for GCM
    - **BACKWARD COMPAT**: Clients omitting `auth_tag` still work via AES-256-CBC fallback
    
    ### Version 1.4.0 (2026-02-22)
    - **NEW**: System API — device info, time/NTP/DST, reboot, shutdown, factory reset, diagnostics, maintenance, watchdog, backup/restore, alarm thresholds
    - **NEW**: Logging API — multi-source log retrieval (kernel, thermal, sysdiag, boot, nginx, security, audit, access), log config, remote syslog forwarding, system logger control with per-source intervals and per-destination enable
    - **NEW**: Firmware API — version info, binary upload, validation, upgrade with progress tracking, cancel
    - **NEW**: Diagnostic bundle download (`.tar.gz` with network, hardware, config, logs)
    - **NEW**: Security log with login failure tracking (IP, user, reason)
    - **NEW**: Audit log with config change tracking (IP, user, target, new values)
    - **NEW**: Access log with per-request metrics (IP, method, URI, status, timing)
    - **NEW**: System logger background service — collects kernel dmesg diffs, thermal readings, system diagnostics snapshots to flash and optional SD card
    
    ### Version 1.3.0 (2026-02-17)
    - **BREAKING**: User endpoints now use numeric `{id}` instead of `{username}` in paths
    - **BREAKING**: `PUT /users/{id}` no longer accepts `password` field (use `/auth/reset-password`)
    - **BREAKING**: `POST /users/create` response returns `user_id` (int64) instead of `username`
    - **NEW**: Encrypted password support in `POST /users/create` (RSA-OAEP + AES-256-CBC)
    - **NEW**: Self-deletion prevention on `DELETE /users/{id}`
    - **NEW**: New users created with `password_must_change=true` for mandatory initial setup
    - **NEW**: Unified REST router for `/users` dispatching GET/POST/PUT/DELETE by method and URL
    - **FIX**: SQL column mapping in `ListUsers` and `GetUser` (enabled/last_login/last_login_ip were shifted)
    - **FIX**: Individual user GET/PUT/DELETE routes were not reachable (missing registrations)
    - **FIX**: `POST /auth/rotate-keys` was using wrong database path for authentication
    - **UPDATED**: Auth API v1.3.1 with HandleRotateKeys database path fix
    - **UPDATED**: Events API v1.1.0 with security audit notes
    
    ### Version 1.2.0 (2026-02-17)
    - **NEW**: Analytics v2 modular handlers (motion, tampering, smart, linecross, intrusion)
    - **NEW**: Video tampering detection API (defocus, masking, scene change, exposure)
    - **NEW**: Smart detection API (pedestrian, vehicle, animal classification)
    - **NEW**: Line crossing detection API with counting
    - **NEW**: Zone intrusion detection API
    - **NEW**: Notification servers configuration (MQTT, Email, FTP) with test endpoint
    - **NEW**: Events management API (query, rules CRUD, statistics, test triggers)
    - **NEW**: Analytics capabilities and toggles endpoints
    - **UPDATED**: Analytics overview with unified config and engine control
    
    ### Version 1.1.0 (2026-01-23)
    - **NEW**: Security Questions system for password recovery
    - **NEW**: Forgot Password self-service flow
    - **NEW**: Initial Setup endpoint for first-time login
    - **UPDATED**: Login response includes setup status flags
    
    ### Version 1.0.0 (2025-11-15)
    - Initial release
    
    **Security**: All endpoints require HTTPS and authentication via Bearer token obtained from `/auth/login`.
    Sensitive credentials are encrypted using AES-256-GCM and stored in SQLCipher database.
  version: 1.6.0
  contact:
    name: HON-BA

