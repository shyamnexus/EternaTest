  /firmware/cancel:
    $ref: './firmware.yaml#/paths/~1firmware~1cancel'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authentication token obtained from /auth/login endpoint.
        Include in the Authorization header as: Bearer <token>

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

    SmtpConfig:
      $ref: './smtp.yaml#/components/schemas/SmtpConfig'

    SnmpConfig:
      $ref: './snmp.yaml#/components/schemas/SnmpConfig'

    SnmpStatus:
      $ref: './snmp.yaml#/components/schemas/SnmpStatus'

    UpnpConfig:
      $ref: './upnp.yaml#/components/schemas/UpnpConfig'

    UpnpDeviceInfo:
      $ref: './upnp.yaml#/components/schemas/UpnpDeviceInfo'

    UpnpPortMapping:
      $ref: './upnp.yaml#/components/schemas/UpnpPortMapping'

  responses:
    Unauthorized:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Authentication required
    
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

