user nobody;
worker_processes 1;
worker_rlimit_nofile 512;
error_log /var/log/nginx/error.log error;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging - minimal for embedded
    access_log off;
    error_log /var/log/nginx/error.log error;

    # Performance - optimized for low memory
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 50;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 10;

    # Buffer sizes - reduced for 512MB RAM
    client_body_buffer_size 16k;
    client_max_body_size 200m;  # Generous limit for firmware uploads
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_body_temp_path /mnt/app/ipcamera/nginx_temp 1 2;

    # Gzip - disabled to save CPU/RAM
    gzip off;

    # Essential security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Rate limiting zones - optimized for embedded
    limit_req_zone $binary_remote_addr zone=api_limit:512k rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:256k;

    # Upstream for CivetWeb Unix socket
    upstream civetweb_backend {
        server unix:/var/run/ipcam_api.sock;
    }

    # HTTP server - redirect to HTTPS (with ONVIF exception)
    server {
        listen 80;
        server_name _;
        
        # Allow snapshot over HTTP (camera functionality)
        location /snapshot {
            root /tmp;
            add_header Content-Disposition "inline";
            try_files /test_jpeg0.jpeg =404;
        }
        
        # ONVIF endpoints - proxy to ONVIF service on port 5000
        # Required for WS-Discovery to work (advertises port 80)
        location /onvif/ {
            proxy_pass http://127.0.0.1:5000/onvif/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Type $content_type;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        
        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL configuration - optimized for embedded with HTTP/2
        ssl_certificate /etc/nginx/ssl/Server.crt;
        ssl_certificate_key /etc/nginx/ssl/Server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:512k;
        ssl_session_timeout 5m;
        ssl_session_tickets off;

        # HTTP/2 settings for embedded
        http2_max_concurrent_streams 32;
        client_header_timeout 30s;

        # Root and index
        root /var/www;
        index index.html index.htm index.csr.html;

        # API endpoints - reverse proxy to CivetWeb Unix socket
        location /api/ {
            # Rate limiting for API protection (permissive)
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 25;
            
            proxy_pass http://civetweb_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Default timeouts for regular API calls
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ONVIF endpoints - proxy to ONVIF service on port 5000
        location /onvif/ {
            proxy_pass http://127.0.0.1:5000/onvif/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Type $content_type;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # Firmware upload - dynamic timeout based on upload speed
        location /api/firmware/upload {
            limit_conn conn_limit 1;
            
            proxy_pass http://civetweb_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended for large uploads: 200MB @ 100KB/s = ~35min worst case
            proxy_connect_timeout 60s;
            proxy_send_timeout 0;  # Disable - let upload complete
            proxy_read_timeout 0;  # Disable - dynamic based on data flow
        }

        # go2rtc WebRTC/WebSocket proxy - same port as web UI for SSL certificate sharing
        location /go2rtc/ {
            proxy_pass http://127.0.0.1:1984/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Static files
        location / {
            try_files $uri $uri/ /index.csr.html;
            
            # Cache static assets - shorter for embedded
            location ~* \\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public";
            }
        }

        # BMP images from SD card
        location ~* \.bmp$ {
            root /mnt/sd;
            add_header Content-Disposition "inline";
            add_header Cache-Control "no-cache";
            expires 0;
        }

        # Snapshot endpoint
        location /snapshot {
            root /tmp;
            add_header Content-Disposition "inline";
            add_header Cache-Control "no-cache";
            try_files /test_jpeg0.jpeg =404;
        }

        # Security - block hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Custom 404 fallback to root
        error_page 404 /;
    }
}
