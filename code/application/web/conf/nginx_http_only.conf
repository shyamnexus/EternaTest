worker_processes  1;

# HTTP-only, no fcgiwrap

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log off;
    add_header 'Access-Control-Allow-Origin' http://localhost:4200;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
    add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Range,Content-Type,Authorization';
    add_header 'Access-Control-Expose-Headers' 'X-Location';

    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_min_length 20;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/javascript application/x-javascript text/javascript image/png image/x-icon;
    gzip_static on;
    gzip_buffers 2 4k;
    gzip_http_version 1.1;

    # HTTP server only
    server {
        listen 80;
        server_name localhost;

        location / {
            root   /var/www;
            index  index.html index.htm index.csr.html;
        }

        location ~* \.bmp$ {
            root /mnt/sd;
            add_header Content-Disposition inline;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length';
        }

        # Snapshot API
        location /snapshot {
            root /tmp;
            add_header Content-Disposition inline;
            try_files /test_jpeg0.jpeg =404;
        }

        error_page  404              /;
    }
}
