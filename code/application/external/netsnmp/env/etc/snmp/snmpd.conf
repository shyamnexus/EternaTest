# Minimal snmpd.conf for IP camera
# allows read-only access for community "public" (change for production)
com2sec readonly  default         public
group   MyROGroup v1         readonly
group   MyROGroup v2c        readonly
view    all    included   .1
access  MyROGroup ""      any       noauth    exact  all    none    none
sysLocation  "IP Camera"
sysContact   "support@example.com"
# listen on all interfaces, port 1161 can be overridden on command line
# agentAddress udp:161,udp6:[::1]:161
