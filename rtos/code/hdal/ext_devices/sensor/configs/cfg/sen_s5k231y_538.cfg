[MAP]
path_1 = 0                          #Path 1 Enable
path_2 = 0                          #Path 2 Disable
path_3 = 0                          #Path 3 Disable
path_4 = 0                          #Path 4 Disable
path_5 = 1                          #Path 5 Disable
path_6 = 0                          #Path 6 Disable
path_7 = 0                          #Path 7 Disable
path_8 = 0                          #Path 8 Disable

[PRESET]
id_4_expt_time = 10000              #10000us
id_4_gain_ratio = 1000              #1x gain

[DIRECTION]
id_4_mirror = 0                     #no mirror
id_4_flip = 0                       #no flip

[POWER]
id_4_mclk = 0                       #CTL_SEN_CLK_SEL_SIEMCLK1
id_4_pwdn_pin = 0xFFFFFFFF          #no pwdn pin, C_GPIO:+0x0; P_GPIO:+0x20; S_GPIO:+0x40; L_GPIO:+0x60; D_GPIO:0x80; H_GPIO:+0xA0; A_GPIO:0xC0; D_GPIO:0xE0;
id_4_rst_pin = 0x4C                 #S_GPIO_12, C_GPIO:+0x0; P_GPIO:+0x20; S_GPIO:+0x40; L_GPIO:+0x60; D_GPIO:0x80; H_GPIO:+0xA0; A_GPIO:0xC0; D_GPIO:0xE0;
id_4_rst_time = 1                   #1ms
id_4_stable_time = 1                #1ms

[I2C]
id_4_i2c_id = 0                     #SEN_I2C_ID_1
id_4_i2c_addr = 0x10                #0x20 >> 1 = 0x10
